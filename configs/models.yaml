models:
  # =========================================================
  # 6x4 阵容 v4 — 定稿 (2026-08-28，见 docs/MODEL_MATRIX.md)
  #
  #  GPT-5.6-Luna        OpenAI official batch
  #  Gemini-2.5-Flash    OpenRouter batch
  #  DeepSeek-V4-Flash   官方 API           (谷值定价)
  #  Qwen-3.7-Plus       官方 DashScope     (按量付费 + batch)
  #  Llama-4-Maverick    OpenRouter realtime
  #  MiniMax-M3          OpenRouter realtime ($0.3 / $1.2 每 M)
  #
  # ⚠️ 内部推理全部禁用（方法学要求，见 METHODOLOGY_JUSTIFICATION.md）:
  #   OpenRouter 统一:  extra_body={"reasoning": {"enabled": false}}
  #   DeepSeek 官方:    extra_body={"thinking": {"type": "disabled"}}
  #   Qwen DashScope:   extra_body={"enable_thinking": false}
  #   （qwen3.8-max 默认开启思考！必须显式关闭）
  #   realtime 经 SDK 的 extra_body 传递；batch 请求体顶层同键（已实现）。
  # =========================================================

  # 1. GPT-5.6 Luna — OpenAI 官方 Batch API (直连，成本低于 OpenRouter)
  #    ⚠️ 官方模型 ID = gpt-5.6-luna（"luna-pro" 是 OpenRouter 别名，官方不存在）
  #    ✅ 2026-08-28 实测: reasoning_effort="none" → reasoning_tokens=0
  #    ⚠️ 官方要求 max_completion_tokens（代码已适配）；官方 Batch 有
  #       queued-prompt-token/模型 限额 → 生成时 --batch-chunk 分片
  - name: "gpt-5.6-luna"
    provider: "openai"
    display_name: "GPT-5.6-Luna"
    context_window: 400000
    mode: "batch"
    api_extra: {"reasoning_effort": "none"}
    note: "官方 batch 50% off；分片提交 --batch-chunk"

  # 2. Gemini 2.5 Flash — OpenRouter batch (推理禁用: reasoning.enabled=false)
  #    ✅ 2026-08-28 batch 实测 rt=0（flash 与 lite 均通过）
  #    ⚠️ Gemini 3.x 强制推理无法关闭 → 以 2.5 为代表（方法学依据见 MODEL_MATRIX.md §1.4）
  - name: "google/gemini-2.5-flash:batch"
    provider: "openrouter"
    display_name: "Gemini-2.5-Flash"
    context_window: 1048576
    mode: "batch"
    api_extra: {"reasoning": {"enabled": false}}
    note: "realtime 403 地域限制；batch 已验证（rt=0）"

  # 3. DeepSeek V4-Flash — 官方 API (思考禁用: thinking.type=disabled)
  #    ⚠️ 2026-08-28 官方文档确认默认思考开启；disabled 后 reasoning_tokens=0
  - name: "deepseek-v4-flash"
    provider: "deepseek"
    display_name: "DeepSeek-V4-Flash"
    context_window: 163840
    mode: "realtime"
    api_extra: {"thinking": {"type": "disabled"}}
    note: "谷值定价；温度 0.7 仅在非思考模式生效（官方文档）"

  # 4. Qwen 3.7-Plus — 官方 DashScope (思考禁用: enable_thinking=false)
  #    ✅ 2026-08-28 用户定稿（比 3.8-max 便宜 ~5x，主流商业档）
  #    ⚠️ qwen3.x 均为混合思考模型，必须显式关闭
  - name: "qwen3.7-plus"
    provider: "aliyun"
    display_name: "Qwen-3.7-Plus"
    context_window: 1000000
    mode: "batch"
    api_extra: {"enable_thinking": false}
    note: "免费额度仅 realtime；全量走 batch"

  # 5. Llama-4 Maverick — OpenRouter realtime (无内部推理)
  - name: "meta-llama/llama-4-maverick"
    provider: "openrouter"
    display_name: "Llama-4-Maverick"
    context_window: 1048576
    mode: "realtime"
    api_extra: {"reasoning": {"enabled": false}}

  # 6. MiniMax-M3 — OpenRouter realtime (推理禁用)
  #    ⚠️ 2026-08-28 wave A: batch 忽略 reasoning.enabled=false (rt>0)；
  #       realtime 同参数 rt=0 有效 → 全量走 realtime（价格与 batch 相同）
  - name: "minimax/minimax-m3"
    provider: "openrouter"
    display_name: "MiniMax-M3"
    context_window: 1048576
    mode: "realtime"
    api_extra: {"reasoning": {"enabled": false}}
    note: "batch 推理不可关；realtime 已验证 rt=0"
